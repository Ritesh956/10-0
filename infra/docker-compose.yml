services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: futbol
      POSTGRES_PASSWORD: futbol
      POSTGRES_DB: futbol
    ports:
      - "5432:5432"
    volumes:
      - futbol_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  futbol_postgres_data:
